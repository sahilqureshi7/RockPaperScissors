<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sahil & Shahin's Train Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --seat-blue: #0056b3; 
            --seat-blue-dark: #004085;
            --metal-light: #e2e8f0;
            --metal-base: #cbd5e1;
            --metal-dark: #94a3b8;
            --metal-heavy: #64748b;
            --led-red: #ff3333;
            --cute-pink: #ff9a9e;
            --rubber-seal: #222;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            user-select: none; 
            -webkit-tap-highlight-color: transparent; 
        }

        /* FIXED HEIGHT FOR MOBILE APP FEEL */
        body {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #111827 0%, #000000 100%);
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; 
            font-family: 'Baloo 2', cursive; 
            color: #334155;
        }

        #phone-screen {
            width: 100%; 
            height: 100%; /* Locks to the exact viewport height */
            max-width: 420px; 
            background-color: var(--metal-light);
            position: relative; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        @media (min-width: 450px) { 
            #phone-screen { 
                height: 90%; 
                max-height: 850px;
                border-radius: 30px; 
                border: 8px solid #1f2937; 
            } 
        }

        /* --- LED Indicator --- */
        #led-container {
            background: #0a0a0a; color: var(--led-red); font-family: 'Courier New', monospace;
            font-weight: 900; font-size: 1rem; padding: 5px 0; text-shadow: 0 0 8px var(--led-red);
            border-bottom: 4px solid #000; z-index: 20; letter-spacing: 2px; overflow: hidden; white-space: nowrap; box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .scrolling-text { display: inline-block; padding-left: 100%; animation: scroll-left 12s linear infinite; }
        @keyframes scroll-left { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        /* --- Authentic Ceiling Hardware --- */
        #ceiling-rig {
            height: 70px; background: linear-gradient(180deg, #f8fafc, #cbd5e1);
            border-bottom: 4px solid var(--metal-heavy); display: flex; flex-direction: column; position: relative; z-index: 15;
            box-shadow: 0 6px 10px rgba(0,0,0,0.3);
        }
        
        .ceiling-fixtures { display: flex; justify-content: space-around; align-items: center; height: 35px; padding: 0 10px; }
        .fan-grill {
            width: 35px; height: 35px; border-radius: 50%; background: #111;
            border: 3px solid var(--metal-heavy); position: relative;
            background-image: repeating-conic-gradient(from 0deg, #222 0deg 20deg, #111 20deg 40deg);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 2px 4px rgba(0,0,0,0.2);
        }
        .fan-grill::after { content:''; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:12px; height:12px; background:var(--metal-dark); border-radius:50%; }
        
        .tube-light { width: 70px; height: 10px; background: #fff; border-radius: 2px; box-shadow: 0 0 12px #fff, inset 0 0 4px #e2e8f0; border: 1px solid var(--metal-base); }

        .grab-rail { width: 100%; height: 5px; background: linear-gradient(180deg, #f1f5f9, #94a3b8); margin-top: 5px; box-shadow: 0 3px 5px rgba(0,0,0,0.4); position: relative; display: flex; justify-content: space-evenly;}
        .handle-assembly { display: flex; flex-direction: column; align-items: center; transform-origin: top; animation: sway 2.5s infinite alternate ease-in-out; }
        .handle-assembly:nth-child(even) { animation-delay: 0.5s; }
        .strap { width: 6px; height: 15px; background: #475569; border-radius: 2px; box-shadow: inset 1px 0 2px rgba(0,0,0,0.5); }
        .loop { width: 30px; height: 35px; border: 4px solid var(--metal-heavy); border-radius: 6px 6px 15px 15px; box-shadow: inset 0 -2px 4px rgba(0,0,0,0.3), 0 3px 4px rgba(0,0,0,0.2); }
        @keyframes sway { 0% { transform: rotate(-8deg); } 100% { transform: rotate(8deg); } }

        /* --- Diorama / Scene --- */
        #diorama { flex: 1; position: relative; display: flex; flex-direction: column; justify-content: flex-end; background: var(--metal-base); min-height: 0; }
        
        .metal-wall {
            position: absolute; top: 0; left: 0; right: 0; bottom: 35%;
            background: repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0,0,0,0.05) 40px, rgba(0,0,0,0.05) 42px);
        }
        
        .luggage-rack {
            position: absolute; top: 0; left: 0; width: 100%; height: 40px;
            background: repeating-linear-gradient(0deg, var(--metal-dark), var(--metal-dark) 4px, transparent 4px, transparent 12px);
            border-bottom: 5px solid var(--metal-heavy); box-shadow: 0 8px 15px rgba(0,0,0,0.4); z-index: 5;
        }

        .window-frame-container {
            position: absolute; top: 55px; left: 30px; right: 30px; height: 40%;
            background: var(--rubber-seal); padding: 8px; border-radius: 12px;
            box-shadow: 0 0 0 6px var(--metal-heavy), 0 8px 20px rgba(0,0,0,0.3); z-index: 2;
        }
        .window-glass { background: linear-gradient(to bottom, #ff9a9e, #a1c4fd); width: 100%; height: 100%; border-radius: 4px; position: relative; overflow: hidden; box-shadow: inset 0 0 25px rgba(0,0,0,0.5); }
        .window-bars { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; justify-content: space-evenly; z-index: 4; pointer-events: none; }
        .bar { height: 6px; background: linear-gradient(to bottom, #f8fafc 0%, #94a3b8 60%, #475569 100%); box-shadow: 0 4px 6px rgba(0,0,0,0.6); }
        
        .scenery-city {
            position: absolute; bottom: 0; left: 0; width: 200%; height: 60%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100"><rect x="10" y="40" width="30" height="60" fill="%231e293b"/><rect x="50" y="20" width="40" height="80" fill="%230f172a"/><rect x="100" y="50" width="35" height="50" fill="%23334155"/><path d="M160 100 V30 Q170 10 180 30 V100" fill="%231e293b"/><rect x="220" y="30" width="45" height="70" fill="%230f172a"/><rect x="280" y="10" width="30" height="90" fill="%231e293b"/></svg>');
            background-repeat: repeat-x; background-size: contain; background-position: bottom; animation: moveLeft 5s linear infinite; z-index: 2; opacity: 0.8;
        }
        .electric-pole { position: absolute; top: 0; width: 14px; height: 100%; background: linear-gradient(90deg, #1e293b, #000); box-shadow: -5px 0 15px rgba(0,0,0,0.8); z-index: 3; right: -50px; animation: flashBy 0.8s linear infinite; }
        @keyframes flashBy { 0% { transform: translateX(50px); } 100% { transform: translateX(-500px); } }
        @keyframes moveLeft { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

        /* The Mumbai Local Bench */
        .train-bench {
            height: 38%; width: 100%; position: relative; z-index: 3; display: flex; flex-direction: column;
        }
        .bench-metal-back {
            flex: 1; width: 100%; background: linear-gradient(180deg, var(--metal-light), var(--metal-dark));
            border-top: 4px solid var(--metal-heavy); box-shadow: inset 0 15px 15px rgba(0,0,0,0.1), 0 -8px 15px rgba(0,0,0,0.3);
            border-radius: 12px 12px 0 0; position: relative;
        }
        .bench-seat-cushion {
            height: 50%; width: 100%; background: var(--seat-blue); border-top: 5px solid var(--seat-blue-dark);
            box-shadow: inset 0 10px 15px rgba(255,255,255,0.1), 0 -4px 12px rgba(0,0,0,0.4);
            background-image: repeating-linear-gradient(90deg, transparent, transparent 20px, rgba(0,0,0,0.05) 20px, rgba(0,0,0,0.05) 22px);
            position: relative;
        }

        /* Movie Ticket */
        .movie-ticket {
            position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%) rotate(-8deg); 
            padding: 5px 12px; background: #fde047; border: 2px dashed #ca8a04; z-index: 5; 
            box-shadow: 2px 2px 6px rgba(0,0,0,0.4); display: flex; justify-content: center; 
            align-items: center; font-size: 0.85rem; font-weight: 900; color: #854d0e; 
            border-radius: 3px; letter-spacing: 0.5px; white-space: nowrap;
        }
        .movie-ticket::before, .movie-ticket::after { 
            content: ''; position: absolute; width: 12px; height: 12px; background: var(--seat-blue); 
            border-radius: 50%; top: 50%; transform: translateY(-50%); box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
        }
        .movie-ticket::before { left: -6px; } .movie-ticket::after { right: -6px; }

        /* --- Clean UI Overlay --- */
        #ui-layer {
            position: absolute; top: 42px; left: 12px; right: 12px;
            display: flex; justify-content: space-between; z-index: 50; pointer-events: none;
        }
        #scoreboard, #game-status {
            background: rgba(255,255,255,0.92); padding: 4px 12px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            font-size: 0.9rem; font-weight: 800; display: flex; gap: 8px; backdrop-filter: blur(4px);
        }
        #scoreboard { border: 2px solid var(--cute-pink); }
        .score-sahil { color: #1e293b; } .score-shahin { color: #2563eb; }
        #game-status { color: #ff4757; border: 2px solid #fecfef; }

        /* Moves (Floating in Center) */
        .moves-layer { position: absolute; top: 18%; width: 100%; display: flex; justify-content: space-around; z-index: 25; pointer-events: none;}
        .move-bubble {
            width: 65px; height: 65px; background: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2.6rem; 
            box-shadow: 0 8px 15px rgba(0,0,0,0.3); opacity: 0; transform: translateY(15px) scale(0.5); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 4px solid #f8fafc;
        }
        .move-bubble.show { opacity: 1; transform: translateY(0) scale(1); }

        /* --- Characters --- */
        .characters-container {
            position: absolute; bottom: 8%; left: 0; width: 100%; height: 50%; 
            display: flex; justify-content: space-evenly; align-items: flex-end; z-index: 40; pointer-events: none;
        }
        .character-full { 
            width: 45%; max-width: 170px; height: 100%; position: relative; 
            transform-origin: bottom center; animation: bodySway 2s infinite alternate ease-in-out; 
            display: flex; justify-content: center; align-items: flex-end;
        }
        .character-full:nth-child(2) { animation-delay: -1s; }
        @keyframes bodySway { 0% { transform: rotate(-1deg) translateY(2px); } 100% { transform: rotate(1deg) translateY(-2px); } }
        
        .char-svg { width: 100%; max-height: 100%; display: block; overflow: visible; filter: drop-shadow(0 15px 10px rgba(0,0,0,0.5)); }
        
        .char-svg .eyes-normal, .char-svg .mouth-normal, .char-svg .eyes-action, .char-svg .mouth-action, .char-svg .eyes-sad, .char-svg .mouth-sad { transition: opacity 0.2s; }
        .char-svg .eyes-action, .char-svg .mouth-action, .char-svg .eyes-sad, .char-svg .mouth-sad { opacity: 0; }
        
        .state-win .eyes-normal { opacity: 0; } .state-win .eyes-action { opacity: 1 !important; }
        .state-win .mouth-normal { opacity: 0; } .state-win .mouth-action { opacity: 1 !important; }
        .state-lose .eyes-normal { opacity: 0; } .state-lose .eyes-sad { opacity: 1 !important; }
        .state-lose .mouth-normal { opacity: 0; } .state-lose .mouth-sad { opacity: 1 !important; }

        /* --- COMIC STYLE SPEECH BUBBLES --- */
        .speech-bubble {
            position: absolute;
            top: -15px;
            background: #fff;
            padding: 6px 12px;
            border-radius: 18px;
            font-size: 1rem;
            font-weight: 900;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            opacity: 0;
            z-index: 100;
            white-space: nowrap;
            border: 3px solid;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        /* Sahil's Bubble (Left side, tilts left) */
        #sahil-speech {
            left: 20%;
            border-color: #3b82f6; 
            color: #1e3a8a;
            transform: scale(0) rotate(-6deg);
            transform-origin: bottom left;
        }
        #sahil-speech.show-speech {
            opacity: 1;
            transform: scale(1) rotate(-6deg) translateY(-25px);
        }
        #sahil-speech::after {
            content: ''; position: absolute; bottom: -11px; left: 20px;
            border-width: 12px 10px 0; border-style: solid; border-color: #3b82f6 transparent transparent transparent;
        }
        #sahil-speech::before {
            content: ''; position: absolute; bottom: -5px; left: 23px;
            border-width: 7px 6px 0; border-style: solid; border-color: #fff transparent transparent transparent; z-index: 1;
        }
        
        /* Shahin's Bubble (Right side, tilts right) */
        #shahin-speech {
            right: 20%;
            border-color: #ec4899; 
            color: #831843;
            transform: scale(0) rotate(6deg);
            transform-origin: bottom right;
        }
        #shahin-speech.show-speech {
            opacity: 1;
            transform: scale(1) rotate(6deg) translateY(-25px);
        }
        #shahin-speech::after {
            content: ''; position: absolute; bottom: -11px; right: 20px;
            border-width: 12px 10px 0; border-style: solid; border-color: #ec4899 transparent transparent transparent;
        }
        #shahin-speech::before {
            content: ''; position: absolute; bottom: -5px; right: 23px;
            border-width: 7px 6px 0; border-style: solid; border-color: #fff transparent transparent transparent; z-index: 1;
        }

        .reaction-icon { position: absolute; top: -10px; right: 0px; font-size: 1.8rem; opacity: 0; transform: scale(0); transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4)); z-index: 30; }
        .show-reaction { opacity: 1; transform: scale(1); }

        /* --- Controls --- */
        #controls-section { background: var(--metal-dark); padding: 15px; border-top: 5px solid #475569; z-index: 50; position: relative; box-shadow: 0 -10px 20px rgba(0,0,0,0.6); }
        .controls-header { color: #fff; text-align: center; font-size: 1.05rem; font-weight: 900; margin-bottom: 10px; text-shadow: 0 2px 4px rgba(0,0,0,0.6);}
        .button-group { display: flex; justify-content: space-between; gap: 12px; }
        .rps-btn {
            flex: 1; background: white; border: none; border-radius: 18px; padding: 12px 0; font-size: 2.5rem;
            box-shadow: 0 6px 0 var(--metal-heavy), 0 10px 15px rgba(0,0,0,0.4); cursor: pointer; transition: all 0.1s; display: flex; justify-content: center; align-items: center;
        }
        .rps-btn:active { transform: translateY(6px); box-shadow: 0 0 0 var(--metal-heavy), 0 4px 5px rgba(0,0,0,0.2); }
        .rps-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: translateY(6px); box-shadow: 0 0 0 var(--metal-heavy); filter: grayscale(50%);}

        /* --- End Screen Modal --- */
        #victory-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.5s; padding: 20px;
        }
        #victory-screen.visible { opacity: 1; pointer-events: all; }
        .victory-art { font-size: 5.5rem; margin-bottom: 5px; animation: float 2s infinite ease-in-out; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.1)); }
        .victory-title { color: #ff4757; font-size: 2.5rem; font-weight: 900; line-height: 1.1; margin-bottom: 10px; text-align: center; text-shadow: 2px 2px 0px #ffeaa7;}
        .victory-msg { color: #334155; font-size: 1.15rem; text-align: center; margin-bottom: 30px; font-weight: 700;}
        .play-again-btn { background: linear-gradient(135deg, #ff9a9e, #fecfef); color: #d61f3d; border: none; padding: 15px 40px; font-size: 1.4rem; font-weight: 900; border-radius: 30px; box-shadow: 0 6px 0 #ff758c, 0 10px 20px rgba(255, 117, 140, 0.4); cursor: pointer; transition: transform 0.1s; }
        .play-again-btn:active { transform: translateY(6px); box-shadow: 0 0 0 #ff758c; }

        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        .bounce { animation: mini-bounce 0.4s ease-in-out; }
        @keyframes mini-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .shake { animation: shake 0.4s ease-in-out; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px) rotate(-4deg); } 75% { transform: translateX(4px) rotate(4deg); } }
        .floating-heart { position: absolute; font-size: 1.5rem; z-index: 50; animation: floatUp 1.5s ease-out forwards; pointer-events: none; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-80px) scale(1.5); opacity: 0; } }
        .confetti { position: absolute; width: 10px; height: 10px; z-index: 101; animation: fall linear forwards; border-radius: 2px;}
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }
    </style>
</head>
<body>

<div id="phone-screen">
    <div id="led-container"><div class="scrolling-text">पुढील स्थानक: पनवेल | NEXT STATION: PANVEL &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; पुढील स्थानक: पनवेल | NEXT STATION: PANVEL</div></div>
    
    <div id="ceiling-rig">
        <div class="ceiling-fixtures"><div class="fan-grill"></div><div class="tube-light"></div><div class="fan-grill"></div></div>
        <div class="grab-rail">
            <div class="handle-assembly"><div class="strap"></div><div class="loop"></div></div>
            <div class="handle-assembly"><div class="strap"></div><div class="loop"></div></div>
            <div class="handle-assembly"><div class="strap"></div><div class="loop"></div></div>
            <div class="handle-assembly"><div class="strap"></div><div class="loop"></div></div>
        </div>
    </div>

    <!-- UI Overlay pushed to top corners -->
    <div id="ui-layer">
        <div id="game-status">Round 1 / 5 💕</div>
        <div id="scoreboard">
            <span class="score-sahil">Sahil: <span id="score-sahil">0</span></span>
            <span>|</span>
            <span class="score-shahin">Shahin: <span id="score-shahin">0</span></span>
        </div>
    </div>

    <!-- Main Scene -->
    <div id="diorama">
        <div class="metal-wall"></div>
        <div class="luggage-rack"></div>

        <!-- Floating Moves in Background relative to characters -->
        <div class="moves-layer">
            <div id="sahil-move" class="move-bubble"></div>
            <div id="shahin-move" class="move-bubble"></div>
        </div>

        <div class="window-frame-container">
            <div class="window-glass">
                <div class="scenery-city"></div>
                <div class="electric-pole"></div>
                <div class="window-bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
            </div>
        </div>

        <div class="train-bench">
            <div class="bench-metal-back"></div>
            <div class="bench-seat-cushion"></div>
            <div class="movie-ticket">AWAARAPAN 2</div>
        </div>
        
        <!-- Characters Container -->
        <div class="characters-container">
            
            <!-- Sahil -->
            <div class="character-full" id="sahil">
                <div class="speech-bubble" id="sahil-speech"></div>
                <div class="reaction-icon" id="sahil-reaction">✨</div>
                
                <svg viewBox="0 0 200 350" class="char-svg" id="sahil-char-svg">
                    <rect x="55" y="140" width="25" height="85" rx="12" fill="#0f172a"/>
                    <rect x="120" y="140" width="25" height="85" rx="12" fill="#0f172a"/>
                    
                    <rect x="52" y="210" width="46" height="50" rx="10" fill="#111827"/> 
                    <rect x="58" y="240" width="38" height="85" rx="8" fill="#0f172a"/> 
                    <path d="M 62 320 Q 62 340 76 340 L 90 340 L 90 320 Z" fill="#000"/> 
                    
                    <rect x="102" y="210" width="46" height="50" rx="10" fill="#111827"/> 
                    <rect x="104" y="240" width="38" height="85" rx="8" fill="#0f172a"/> 
                    <path d="M 108 320 Q 108 340 122 340 L 136 340 L 136 320 Z" fill="#000"/> 
                    
                    <rect x="60" y="130" width="80" height="95" rx="20" fill="#111827"/>
                    <rect x="90" y="110" width="20" height="30" fill="#ffe0bd"/>
                    <g transform="translate(50, 40) scale(1)">
                        <circle cx="50" cy="55" r="40" fill="#ffe0bd"/>
                        
                        <path d="M 12,48 Q 5,15 30,10 Q 50,0 70,10 Q 95,15 88,48 Q 75,15 50,20 Q 25,15 12,48 Z" fill="#1e293b"/>
                        <path d="M 15,45 Q 30,20 50,25 Q 70,20 85,45 Q 70,30 50,35 Q 30,30 15,45 Z" fill="#0f172a"/>
                        <path d="M 30,25 L 40,35 L 50,28 L 60,35 L 70,25 Z" fill="#0f172a"/>

                        <g class="eyes-normal">
                            <circle cx="32" cy="55" r="4.5" fill="#0f172a"/>
                            <circle cx="68" cy="55" r="4.5" fill="#0f172a"/>
                        </g>
                        <path class="mouth-normal" d="M 43,72 Q 50,77 57,72" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
                        <g class="eyes-action">
                            <path d="M 27,55 L 37,55 M 32,50 L 32,60" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/> 
                            <circle cx="68" cy="55" r="4.5" fill="#0f172a"/>
                        </g>
                        <path class="mouth-action" d="M 38,70 Q 50,85 62,70 Z" fill="#ff4757" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
                        <g class="eyes-sad">
                            <path d="M 27,55 L 37,58 L 27,61" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M 73,55 L 63,58 L 73,61" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        </g>
                        <path class="mouth-sad" d="M 45,76 Q 50,72 55,76" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
                        <ellipse cx="22" cy="65" rx="6" ry="3" fill="#ffb3c6" opacity="0.8"/>
                        <ellipse cx="78" cy="65" rx="6" ry="3" fill="#ffb3c6" opacity="0.8"/>
                    </g>
                </svg>
            </div>

            <!-- Shahin -->
            <div class="character-full" id="shahin">
                <div class="speech-bubble" id="shahin-speech"></div>
                <div class="reaction-icon" id="shahin-reaction">💦</div>
                
                <svg viewBox="0 0 200 350" class="char-svg" id="shahin-char-svg">
                    <rect x="55" y="70" width="90" height="170" rx="25" fill="#0f172a"/>
                    
                    <rect x="58" y="210" width="36" height="50" rx="15" fill="#2563eb"/> 
                    <rect x="64" y="240" width="26" height="80" rx="10" fill="#1d4ed8"/> 
                    <path d="M 62 315 Q 62 335 76 335 L 90 335 L 90 315 Z" fill="#fff"/> 
                    <rect x="106" y="210" width="36" height="50" rx="15" fill="#2563eb"/> 
                    <rect x="110" y="240" width="26" height="80" rx="10" fill="#1d4ed8"/> 
                    <path d="M 108 315 Q 108 335 122 335 L 136 335 L 136 315 Z" fill="#fff"/> 
                    <rect x="70" y="130" width="60" height="95" rx="15" fill="#111"/>
                    <path d="M 60 130 Q 75 160 70 220 L 55 220 Q 50 180 60 130 Z" fill="#1e3a8a"/>
                    <path d="M 140 130 Q 125 160 130 220 L 145 220 Q 150 180 140 130 Z" fill="#1e3a8a"/>
                    <rect x="52" y="140" width="22" height="85" rx="11" fill="#172554"/>
                    <rect x="126" y="140" width="22" height="85" rx="11" fill="#172554"/>
                    <rect x="90" y="110" width="20" height="30" fill="#fad0c4"/>
                    <g transform="translate(50, 40) scale(1)">
                        <circle cx="50" cy="45" r="42" fill="#0f172a"/> 
                        <circle cx="50" cy="55" r="36" fill="#fad0c4"/> 
                        <path d="M 14,55 Q 30,25 50,30 Q 70,25 86,55 Q 70,40 50,40 Q 30,40 14,55 Z" fill="#0a0a0a"/> 
                        <g class="eyes-normal">
                            <circle cx="33" cy="56" r="4" fill="#0f172a"/>
                            <path d="M 28,48 Q 33,45 38,48" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
                            <circle cx="67" cy="56" r="4" fill="#0f172a"/>
                            <path d="M 62,48 Q 67,45 72,48" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
                        </g>
                        <path class="mouth-normal" d="M 45,72 Q 50,76 55,72" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
                        <g class="eyes-action">
                            <path d="M 28,56 Q 33,51 38,56" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
                            <path d="M 62,56 Q 67,51 72,56" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
                        </g>
                        <path class="mouth-action" d="M 42,70 Q 50,85 58,70 Z" fill="#ff4757" stroke="#0f172a" stroke-width="2.5" stroke-linejoin="round"/>
                        <g class="eyes-sad">
                            <path d="M 28,54 L 38,58 L 28,62" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M 72,54 L 62,58 L 72,62" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                        </g>
                        <path class="mouth-sad" d="M 46,75 L 50,70 L 54,75" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <ellipse cx="25" cy="66" rx="6" ry="3" fill="#ff8da1" opacity="0.8"/>
                        <ellipse cx="75" cy="66" rx="6" ry="3" fill="#ff8da1" opacity="0.8"/>
                    </g>
                    <path d="M 55,80 Q 45,150 65,180 Q 75,120 70,80 Z" fill="#0f172a"/>
                    <path d="M 145,80 Q 155,150 135,180 Q 125,120 130,80 Z" fill="#0f172a"/>
                </svg>
            </div>
        </div>
    </div>

    <!-- User Selection Options -->
    <div id="controls-section">
        <div class="controls-header" id="turn-instruction">Shahin, make your move! ✨</div>
        <div class="button-group">
            <button class="rps-btn" onclick="playRound('✊🏻')">✊🏻</button>
            <button class="rps-btn" onclick="playRound('✋🏻')">✋🏻</button>
            <button class="rps-btn" onclick="playRound('✌🏻')">✌🏻</button>
        </div>
    </div>

    <!-- Final Victory Screen -->
    <div id="victory-screen">
        <div class="victory-art">🎬🍿</div>
        <div class="victory-title">WINNER!</div>
        <div class="victory-msg">Result Message Here</div>
        <button class="play-again-btn" onclick="resetGame()">Play Again 🔄</button>
    </div>
</div>

<script>
    const choices = ['✊🏻', '✋🏻', '✌🏻'];
    
    // Custom phrases requested by the user
    const victoryPhrases = ["Yaa mannn! 😎", "Now what to do? 😏", "Takluuuu! 😂"];
    
    const sahilTeases = ['😏', '😜', '😎', '🤭', '✨'];
    const shahinSulks = ['😤', '🥺', '😑', '🙄', '🚩'];
    const shahinWins = ['😁', '🥰', '🥳', '😎', '✨'];
    const sahilSulks = ['😫', '😑', '🫠', '🤦🏻‍♂️', '🚩'];
    
    const suspenseLines = ["Wait for it... ⏳", "It's getting intense... 🤔", "Who will win? 👀"];

    let currentRound = 1;
    const maxRounds = 5;
    let sahilScore = 0;
    let shahinScore = 0;

    const statusEl = document.getElementById('game-status');
    const instructionEl = document.getElementById('turn-instruction');
    const sahilMoveEl = document.getElementById('sahil-move');
    const shahinMoveEl = document.getElementById('shahin-move');
    const buttons = document.querySelectorAll('.rps-btn');
    
    const sahilChar = document.getElementById('sahil');
    const shahinChar = document.getElementById('shahin');
    const sahilSvg = document.getElementById('sahil-char-svg');
    const shahinSvg = document.getElementById('shahin-char-svg');
    
    const sahilReaction = document.getElementById('sahil-reaction');
    const shahinReaction = document.getElementById('shahin-reaction');
    const sahilSpeech = document.getElementById('sahil-speech');
    const shahinSpeech = document.getElementById('shahin-speech');

    const sleep = ms => new Promise(r => setTimeout(r, ms));
    function setButtonsState(disabled) { buttons.forEach(btn => btn.disabled = disabled); }

    function spawnHearts(element) {
        for(let i=0; i<4; i++) {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerText = ['💖','✨','💕'][Math.floor(Math.random()*3)];
            heart.style.left = (Math.random() * 80 - 40) + 'px';
            heart.style.top = (Math.random() * -20) + 'px';
            element.appendChild(heart);
            setTimeout(() => heart.remove(), 1500);
        }
    }

    async function playRound(shahinChoice) {
        setButtonsState(true);
        instructionEl.innerText = "Game on! 🍿";
        
        // Reset states
        sahilMoveEl.classList.remove('show');
        shahinMoveEl.classList.remove('show');
        sahilReaction.classList.remove('show-reaction');
        shahinReaction.classList.remove('show-reaction');
        sahilSpeech.classList.remove('show-speech');
        shahinSpeech.classList.remove('show-speech');
        sahilSvg.classList.remove('state-win', 'state-lose');
        shahinSvg.classList.remove('state-win', 'state-lose');

        statusEl.innerText = suspenseLines[Math.floor(Math.random() * suspenseLines.length)];
        await sleep(900);
        
        statusEl.innerText = "Rock... Paper... Scissors! 🎯";
        await sleep(700);

        const sahilChoice = choices[Math.floor(Math.random() * choices.length)];
        
        sahilMoveEl.innerText = sahilChoice;
        shahinMoveEl.innerText = shahinChoice;
        sahilMoveEl.classList.add('show');
        shahinMoveEl.classList.add('show');

        // Logic
        let winner = 'tie';
        if (shahinChoice === sahilChoice) {
            winner = 'tie';
        } else if (
            (shahinChoice === '✊🏻' && sahilChoice === '✌🏻') ||
            (shahinChoice === '✋🏻' && sahilChoice === '✊🏻') ||
            (shahinChoice === '✌🏻' && sahilChoice === '✋🏻')
        ) {
            winner = 'shahin';
        } else {
            winner = 'sahil';
        }

        const randomPhrase = victoryPhrases[Math.floor(Math.random() * victoryPhrases.length)];

        if (winner === 'sahil') {
            sahilScore++;
            document.getElementById('score-sahil').innerText = sahilScore;
            
            // Pop the speech bubble for Sahil
            sahilSpeech.innerText = randomPhrase;
            sahilSpeech.classList.add('show-speech');
            
            sahilReaction.innerText = sahilTeases[Math.floor(Math.random() * sahilTeases.length)];
            shahinReaction.innerText = shahinSulks[Math.floor(Math.random() * shahinSulks.length)];
            sahilSvg.classList.add('state-win');
            shahinSvg.classList.add('state-lose');
            
            sahilChar.classList.add('bounce', 'shake');
            setTimeout(() => { sahilChar.classList.remove('bounce', 'shake'); }, 400);
            spawnHearts(sahilChar);

        } else if (winner === 'shahin') {
            shahinScore++;
            document.getElementById('score-shahin').innerText = shahinScore;
            
            // Pop the speech bubble for Shahin
            shahinSpeech.innerText = randomPhrase;
            shahinSpeech.classList.add('show-speech');
            
            shahinReaction.innerText = shahinWins[Math.floor(Math.random() * shahinWins.length)];
            sahilReaction.innerText = sahilSulks[Math.floor(Math.random() * sahilSulks.length)];
            shahinSvg.classList.add('state-win');
            sahilSvg.classList.add('state-lose');
            
            shahinChar.classList.add('bounce', 'shake');
            setTimeout(() => { shahinChar.classList.remove('bounce', 'shake'); }, 400);
            spawnHearts(shahinChar);

        } else {
            sahilReaction.innerText = "👀";
            shahinReaction.innerText = "👀";
        }

        sahilReaction.classList.add('show-reaction');
        shahinReaction.classList.add('show-reaction');

        await sleep(2800);

        if (currentRound >= maxRounds) {
            triggerVictory();
        } else {
            currentRound++;
            statusEl.innerText = `Round ${currentRound} / ${maxRounds} 💕`;
            instructionEl.innerText = "Shahin, make your move! ✨";
            
            sahilMoveEl.classList.remove('show');
            shahinMoveEl.classList.remove('show');
            sahilReaction.classList.remove('show-reaction');
            shahinReaction.classList.remove('show-reaction');
            sahilSpeech.classList.remove('show-speech');
            shahinSpeech.classList.remove('show-speech');
            sahilSvg.classList.remove('state-win', 'state-lose');
            shahinSvg.classList.remove('state-win', 'state-lose');
            
            setButtonsState(false);
        }
    }

    function triggerVictory() {
        const titleEl = document.querySelector('.victory-title');
        const msgEl = document.querySelector('.victory-msg');

        if (sahilScore > shahinScore) {
            titleEl.innerHTML = `SAHIL WINS<br>${sahilScore} - ${shahinScore}!`;
            msgEl.innerHTML = `Sahil dominates the post-movie game! 😏❤️<br><br>Shahin, Awaarapan 2 was great, but your luck wasn't! 😂`;
        } else if (shahinScore > sahilScore) {
            titleEl.innerHTML = `SHAHIN WINS<br>${shahinScore} - ${sahilScore}!`;
            msgEl.innerHTML = `Shahin is the RPS Champion! 👑💖<br><br>Sahil, better luck next time! Takluuu!`;
        } else {
            titleEl.innerHTML = `IT'S A TIE!<br>${sahilScore} - ${shahinScore}`;
            msgEl.innerHTML = `Perfectly balanced, as all things should be. 🤝💕<br><br>Both win this time!`;
        }

        document.getElementById('victory-screen').classList.add('visible');
        createConfetti();
    }

    function resetGame() {
        currentRound = 1; sahilScore = 0; shahinScore = 0;
        document.getElementById('score-sahil').innerText = '0';
        document.getElementById('score-shahin').innerText = '0';
        document.getElementById('victory-screen').classList.remove('visible');
        statusEl.innerText = `Round 1 / 5 💕`;
        instructionEl.innerText = "Shahin, make your move! ✨";
        
        sahilMoveEl.classList.remove('show');
        shahinMoveEl.classList.remove('show');
        sahilReaction.classList.remove('show-reaction');
        shahinReaction.classList.remove('show-reaction');
        sahilSpeech.classList.remove('show-speech');
        shahinSpeech.classList.remove('show-speech');
        sahilSvg.classList.remove('state-win', 'state-lose');
        shahinSvg.classList.remove('state-win', 'state-lose');
        setButtonsState(false);
    }

    function createConfetti() {
        const colors = ['#ff9a9e', '#fbcfe8', '#bfdbfe', '#fde047', '#ff3333'];
        for(let i=0; i<80; i++) {
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');
            confetti.style.left = Math.random() * 100 + 'vw';
            confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
            confetti.style.animationDelay = (Math.random() * 0.5) + 's';
            if(Math.random() > 0.5) confetti.style.borderRadius = '50%';
            document.body.appendChild(confetti);
            setTimeout(() => confetti.remove(), 4000);
        }
    }
</script>
</body>
</html>
